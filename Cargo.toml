[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = { version = "12", features = ["uuid-impl"] }
dirs = "7"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tempfile = "3"
